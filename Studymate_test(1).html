<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>StudyMate – The AI study companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --page: #dff5fb;
            --dpage: #d8d8d8;
            --cv: #f6f6f4;
            --side: #eceeec;
            --card: #fff;
            --card2: rgba(255, 255, 255, .55);
            --ink: #0d0d0f;
            --mute: #6a6a72;
            --line: #e4e4e0;
            --sky: #d6effb;
            --mint: #d1f4dd;
            --lil: #ecd4fb;
            --but: #fdeab3;
            --pk: #f72585;
            --lateb: #fddde1;
            --latet: #a1121f;
            --frame: #050506;
            --sg1: #e8eefb;
            --sg2: #f8eef3;
            --tg: rgba(255, 255, 255, .6);
            --blue-bg: #d9e4fc;
            --blue-fg: #2a4aa6;
            --purple-bg: #e5dcfa;
            --purple-fg: #4a2d9c;
            --red-bg: #fbd8dc;
            --red-fg: #bf3a47;
            --orange-bg: #fce5cb;
            --orange-fg: #a95c0c;
            --green-bg: #cdf0df;
            --green-fg: #17714b;
            --pink-bg: #fad8ef;
            --pink-fg: #b8348f;
            --cyan-bg: #cbedf9;
            --cyan-fg: #127591;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        :root[data-theme="dark"] {
            --page: #0d1519;
            --dpage: #0b0b0c;
            --cv: #18181a;
            --side: #101012;
            --card: #252528;
            --card2: rgba(255, 255, 255, .03);
            --ink: #f4f4f2;
            --mute: #a6a6ad;
            --line: #34343b;
            --sky: #1d3946;
            --mint: #1c3d2a;
            --lil: #3c2650;
            --but: #493e1b;
            --lateb: #4a1c22;
            --latet: #ffa0aa;
            --frame: #000;
            --sg1: #14161c;
            --sg2: #1a1519;
            --tg: rgba(255, 255, 255, .1);
            --blue-bg: #1e2a4d;
            --blue-fg: #aebfff;
            --purple-bg: #2d2350;
            --purple-fg: #c9b8ff;
            --red-bg: #4a2026;
            --red-fg: #ffa3ad;
            --orange-bg: #47321a;
            --orange-fg: #ffc98a;
            --green-bg: #1b3d2e;
            --green-fg: #8de0b8;
            --pink-bg: #471f3c;
            --pink-fg: #ffa8e0;
            --cyan-bg: #17384a;
            --cyan-fg: #8ddcf5;
            color-scheme: dark
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--page);
            color: var(--ink);
            font: 15px/1.45 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif
        }

        h1,
        h2,
        h3,
        p {
            margin: 0
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        [hidden] {
            display: none !important
        }

        .k-blue {
            --bg: var(--blue-bg);
            --fg: var(--blue-fg)
        }

        .k-purple {
            --bg: var(--purple-bg);
            --fg: var(--purple-fg)
        }

        .k-red {
            --bg: var(--red-bg);
            --fg: var(--red-fg)
        }

        .k-orange {
            --bg: var(--orange-bg);
            --fg: var(--orange-fg)
        }

        .k-green {
            --bg: var(--green-bg);
            --fg: var(--green-fg)
        }

        .k-pink {
            --bg: var(--pink-bg);
            --fg: var(--pink-fg)
        }

        .k-cyan {
            --bg: var(--cyan-bg);
            --fg: var(--cyan-fg)
        }

        .mob {
            display: block
        }

        .desk {
            display: none
        }

        .page {
            padding: 20px 14px 40px
        }

        .frame {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--frame);
            border-radius: 36px;
            padding: 0 10px 10px;
            box-shadow: 0 40px 70px -35px rgba(0, 50, 70, .5)
        }

        .top {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 22px;
            color: #fff;
            flex-wrap: wrap
        }

        .brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -.04em;
            display: flex;
            align-items: center;
            gap: 9px
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--pk)
        }

        .seg {
            display: flex;
            background: #1d1d20;
            border-radius: 99px;
            padding: 4px;
            margin: 0 auto
        }

        .seg button {
            border: 0;
            background: none;
            color: #b8b8bf;
            padding: 7px 18px;
            border-radius: 99px;
            font-weight: 700;
            font-size: .85rem
        }

        .seg button.on {
            background: #fff;
            color: #000
        }

        .mseg {
            margin: 0 auto
        }

        .mseg .seg {
            margin: 0
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .av {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--lil);
            color: #000;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: .85rem
        }

        .who {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            font-size: .85rem
        }

        .who small {
            color: #9a9aa2
        }

        .body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            background: var(--cv);
            border-radius: 28px;
            overflow: hidden
        }

        .main {
            padding: 26px 26px 30px
        }

        .side {
            background: var(--side);
            padding: 26px 22px
        }

        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -.04em
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -.03em;
            margin-bottom: 14px
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -.02em
        }

        #q {
            width: min(260px, 100%);
            border: 0;
            background: var(--side);
            border-radius: 99px;
            padding: 11px 18px;
            outline-offset: 2px
        }

        :focus-visible {
            outline: 3px solid var(--pk);
            outline-offset: 2px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px
        }

        .st {
            border-radius: 22px;
            padding: 14px 8px;
            text-align: center
        }

        .st b {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.04em;
            line-height: 1.1
        }

        .st span {
            color: var(--mute);
            font-size: .85rem
        }

        .st.sky {
            background: var(--sky)
        }

        .st.mint {
            background: var(--mint)
        }

        .st.dash {
            border: 2px dashed var(--line)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 14px
        }

        .tc {
            background: var(--card);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
            min-height: 138px
        }

        .tc p {
            color: var(--mute);
            font-size: .85rem
        }

        .tc .ic {
            position: absolute;
            right: 14px;
            top: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: .85rem
        }

        .tc h3 {
            padding-right: 42px
        }

        .tc h3.lk {
            cursor: pointer
        }

        .tc .ft {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 10px;
            gap: 6px
        }

        .tc .hint {
            font-size: .78rem;
            color: var(--mute)
        }

        .chip {
            padding: 5px 12px;
            border-radius: 99px;
            font-size: .78rem;
            font-weight: 700;
            background: var(--mint);
            color: #0d0d0f;
            white-space: nowrap
        }

        .chip.up {
            background: var(--side);
            color: var(--mute)
        }

        .chip.late {
            background: var(--lateb);
            color: var(--latet)
        }

        .rb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 0;
            background: var(--side);
            display: inline-grid;
            place-items: center;
            font-weight: 700;
            margin-left: 4px
        }

        .rb.ok {
            background: #000;
            color: #fff
        }

        :root[data-theme="dark"] .rb.ok {
            background: #fff;
            color: #000
        }

        .tc.done h3 {
            color: var(--mute)
        }

        .tc.add {
            border: 2px dashed var(--line);
            background: none;
            gap: 8px
        }

        input:not([type]),
        input[type=text],
        input[type=date],
        select {
            width: 100%;
            border: 0;
            background: var(--side);
            border-radius: 14px;
            padding: 9px 12px
        }

        .btn {
            border: 0;
            background: #000;
            color: #fff;
            font-weight: 700;
            border-radius: 99px;
            padding: 9px 18px
        }

        .btn.pk {
            background: var(--pk);
            color: #fff
        }

        .btn.lt {
            background: #fff;
            color: #000
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 14px
        }

        .pan {
            border-radius: 28px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            color: var(--ink)
        }

        .pan.lil {
            background: var(--lil);
            box-shadow: 0 22px 30px -22px rgba(120, 40, 160, .6)
        }

        .pan.but {
            background: var(--but)
        }

        .pan.sky {
            background: var(--sky)
        }

        .ph {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px
        }

        .pill {
            font-size: .78rem;
            font-weight: 700;
            background: rgba(255, 255, 255, .65);
            color: #0d0d0f;
            padding: 4px 12px;
            border-radius: 99px
        }

        .chat {
            height: 210px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 10px;
            padding-right: 2px
        }

        .m {
            padding: 8px 13px;
            border-radius: 18px;
            max-width: 88%;
            font-size: .9rem
        }

        .m.bot {
            background: var(--card);
            align-self: flex-start;
            border-bottom-left-radius: 5px
        }

        .m.me {
            background: #000;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 5px
        }

        .chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px
        }

        .cb {
            border: 0;
            background: rgba(255, 255, 255, .6);
            color: #0d0d0f;
            border-radius: 99px;
            padding: 5px 12px;
            font-size: .78rem;
            font-weight: 700
        }

        .send {
            display: flex;
            gap: 6px;
            background: var(--card);
            border-radius: 99px;
            padding: 5px
        }

        .send input {
            background: none;
            padding: 6px 12px
        }

        .send .btn {
            padding: 7px 16px
        }

        .fc {
            background: var(--card);
            border-radius: 22px;
            min-height: 132px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
            border: 0;
            width: 100%
        }

        .fc small {
            color: var(--mute);
            font-weight: 700
        }

        .fc p {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1.3;
            margin: 6px 0
        }

        .fc.back {
            background: #000;
            color: #fff
        }

        .fc.back small {
            color: #aaa
        }

        .nav {
            display: flex;
            gap: 6px;
            margin: 10px 0
        }

        .nav .btn {
            flex: 1;
            padding: 8px
        }

        .nav .btn.lt {
            background: rgba(255, 255, 255, .65)
        }

        .mini {
            display: flex;
            gap: 6px
        }

        .mini input {
            background: rgba(255, 255, 255, .6);
            color: #0d0d0f
        }

        .mini input::placeholder {
            color: #5c5c62
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            border: 2px solid transparent;
            background: var(--card);
            border-radius: 16px;
            padding: 10px 14px;
            margin-top: 7px
        }

        .opt.ok {
            border-color: #168a5b
        }

        .opt.no {
            border-color: #c4202f
        }

        .lock {
            position: absolute;
            inset: 0;
            background: rgba(246, 246, 244, .55);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            padding: 16px;
            color: #0d0d0f;
            z-index: 2
        }

        .lock p {
            font-size: .88rem;
            max-width: 300px
        }

        .ev {
            border-radius: 26px;
            padding: 14px;
            margin-bottom: 12px
        }

        .ev.c0 {
            background: var(--sky)
        }

        .ev.c1 {
            background: var(--lil)
        }

        .ev.c2 {
            background: var(--but)
        }

        .ev.c3 {
            background: var(--mint)
        }

        .ev .r {
            display: flex;
            justify-content: space-between;
            font-size: .85rem;
            font-weight: 700;
            margin-bottom: 9px;
            color: #0d0d0f
        }

        .ev .b {
            background: rgba(255, 255, 255, .55);
            border-radius: 16px;
            padding: 10px 12px;
            font-size: .88rem;
            color: #0d0d0f
        }

        .ch {
            background: var(--card);
            border-radius: 26px;
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden
        }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 7px;
            height: 84px;
            margin-top: 10px
        }

        .bars i {
            flex: 1;
            background: var(--sky);
            border-radius: 8px 8px 4px 4px
        }

        .bars i.hi {
            background: var(--pk)
        }

        .pr {
            background: #000;
            color: #fff;
            border-radius: 26px;
            padding: 18px;
            margin-bottom: 12px
        }

        .pr .price {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -.04em;
            margin: 4px 0
        }

        .pr .price small {
            font-size: .9rem;
            color: #aaa;
            font-weight: 500
        }

        .pr ul {
            padding-left: 18px;
            margin: 8px 0 14px;
            color: #cfcfd4;
            font-size: .88rem
        }

        .tg {
            display: flex;
            background: #1d1d20;
            border-radius: 99px;
            padding: 3px;
            margin-bottom: 6px
        }

        .tg button {
            flex: 1;
            border: 0;
            background: none;
            color: #aaa;
            border-radius: 99px;
            padding: 6px;
            font-weight: 700;
            font-size: .8rem
        }

        .tg button.on {
            background: #fff;
            color: #000
        }

        .ad {
            border: 2px dashed var(--line);
            border-radius: 20px;
            padding: 10px 14px;
            color: var(--mute);
            font-size: .82rem
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 10px 18px;
            border-radius: 99px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            max-width: 92vw;
            text-align: center;
            z-index: 80
        }

        #toast.on {
            opacity: 1
        }

        .tsw {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 99px;
            padding: 4px 12px 4px 4px;
            font-weight: 700;
            font-size: .8rem
        }

        .tsw .kn {
            width: 36px;
            height: 22px;
            border-radius: 99px;
            background: #c9c9d1;
            position: relative;
            transition: background .2s
        }

        .tsw .kn:after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: transform .2s
        }

        .tsw[aria-checked=true] .kn {
            background: var(--pk)
        }

        .tsw[aria-checked=true] .kn:after {
            transform: translateX(14px)
        }

        .top .tsw {
            background: #1d1d20;
            border-color: #2a2a2e;
            color: #fff
        }

        .sv {
            width: 20px;
            height: 20px;
            flex: none
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: grid;
            place-items: center;
            padding: 16px;
            z-index: 60;
            overflow: auto
        }

        .md {
            background: var(--card);
            color: var(--ink);
            border-radius: 24px;
            padding: 22px;
            width: min(520px, 100%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: calc(100vh - 32px);
            overflow: auto
        }

        .md h2 {
            margin: 0
        }

        .md label,
        .md legend {
            font-size: .8rem;
            font-weight: 700;
            color: var(--mute);
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .md input,
        .md select,
        .md textarea {
            width: 100%;
            border: 0;
            background: var(--side);
            color: var(--ink);
            border-radius: 12px;
            padding: 9px 12px
        }

        .md input[type=range] {
            padding: 0;
            background: none;
            accent-color: var(--pk)
        }

        .md input[type=checkbox] {
            width: auto
        }

        .md output {
            display: inline;
            color: var(--ink)
        }

        .md fieldset {
            border: 0;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px
        }

        .md fieldset label {
            flex-direction: row;
            align-items: center;
            gap: 6px;
            color: var(--ink);
            font-weight: 600
        }

        .md .btn.lt {
            background: var(--side);
            color: var(--ink)
        }

        .md .btn.dng,
        .btn.dng {
            color: #c4202f
        }

        .r2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .mf {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .mf span {
            flex: 1
        }

        @media (max-width:900px) {
            .body {
                grid-template-columns: 1fr
            }

            .who small {
                display: none
            }
        }

        @media (max-width:620px) {

            .grid,
            .grid2 {
                grid-template-columns: 1fr
            }

            .main {
                padding: 20px 16px
            }

            .page {
                padding: 10px 6px 30px
            }

            h1 {
                font-size: 1.7rem
            }

            .frame {
                border-radius: 28px
            }
        }

        @media (min-width:901px) {
            .mob {
                display: none
            }

            .desk {
                display: block
            }

            body {
                background: var(--dpage)
            }
        }

        .dpg {
            padding: 32px
        }

        .dwin {
            max-width: 1480px;
            margin: 0 auto;
            height: calc(100vh - 64px);
            min-height: 660px;
            background: var(--cv);
            border-radius: 28px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .35);
            border: 1px solid var(--line)
        }

        .dwin.narrow {
            grid-template-columns: 78px minmax(0, 1fr)
        }

        .dwin.narrow .lbl {
            display: none
        }

        .dside {
            background: linear-gradient(180deg, var(--sg1), var(--sg2));
            border-right: 1px solid var(--line);
            padding: 18px 14px;
            display: flex;

                transition: none !important

        .pb .sv{width:14px;height:14px}

            const t = m.id ? S.tasks.find(x => x.id === m.id) : null;
            const v = t || {t: "", c: S.courses[0] ? S.courses[0].n : "", ty: "Task", d: m.d || today(), s: m.s || "todo", p: 0, tags: [], w: [], n: "", cl: []};
            return `<div class="ov"><form class="md" data-f="mtask" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${t ? "Edit task" : "New task"}</h2><label>Title<input name="t" value="${esc(v.t)}" required maxlength="80"></label><div class="r2"><label>Course<select name="c">${S.courses.map(c => `<option ${c.n === v.c ? "selected" : ""}>${esc(c.n)}</option>`).join("")}</select></label><label>Type<select name="ty">${TYPES.map(x => `<option ${x === v.ty ? "selected" : ""}>${x}</option>`).join("")}</select></label></div><div class="r2"><label>Status<select name="s">${COLS.map(([k, l]) => `<option value="${k}" ${k === v.s ? "selected" : ""}>${l}</option>`).join("")}</select></label><label>Due date<input type="date" name="d" value="${v.d}" required></label></div><label>Progress <output>${v.p}%</output><input type="range" name="p" min="0" max="100" step="5" value="${v.p}" data-rg="1"></label><label>Tags, comma separated<input name="tags" value="${esc(v.tags.join(", "))}"></label><label>Note<input name="n" value="${esc(v.n)}" maxlength="120"></label><label>Checklist, one item per line<textarea name="cl" rows="3">${esc(v.cl.map(x => x.t).join("\n"))}</textarea></label><fieldset><legend>Assigned to</legend>${S.members.map(x => `<label><input type="checkbox" name="w" value="${x.id}" ${v.w.includes(x.id) ? "checked" : ""}>${esc(x.n)}</label>`).join("")}</fieldset><div class="mf">${t ? `<button type="button" class="btn lt dng" data-a="mdel">Delete</button>` : ""}<span></span><button type="button" class="btn lt" data-a="mclose">Cancel</button><button class="btn pk">Save</button></div></form></div>`;
        }

        function filt() {const q = U.q.trim().toLowerCase(); $$("[data-s]").forEach(e => e.hidden = !!q && !e.dataset.s.includes(q))}
        function render() {
            document.documentElement.dataset.theme = S.theme;
            if (!S.premium && ["plan", "focus", "insights"].includes(S.view)) S.view = "board";
            $("#ad").hidden = S.premium;
            set("#mseg", planSeg()); set("#mthm", planBadge() + themeSw());
            set("#muser", `<span class="av">${esc(initials(S.profile.n))}</span><span class="who"><b>${esc(S.profile.n)}</b><small>${esc(S.profile.e)}</small></span>`);
            set("#stats", vStats()); set("#tasks", vTasks()); set("#tutor", vTutor()); set("#cards", vCards()); set("#quiz", vQuiz()); set("#events", vEvents()); set("#chart", vChart()); set("#plans", vPlans() + vCompare(true)); set("#mbanner", vBanner(true)); set("#ptools", vPtools());
            $("#dwin").classList.toggle("narrow", !!S.collapsed);
            $("#wname").textContent = S.profile.n;
            set("#dside", vSide()); set("#dtr", vTr());
            const nob = ["settings", "plans", "support", "plan", "focus", "insights", "activity"], plain = nob.includes(S.view);
            set("#dview", (plain ? "" : vBanner()) + (V[S.view] || vBoard)() + (plain || S.premium ? "" : vAdD()));
            if (U.pay) {if (!(U.pay.keep && $("#modal .pm"))) {const h = vPay(); $("#modal").innerHTML = h; $("#modal").dataset.h = h; U.pay.keep = true}} else set("#modal", vModal());
            filt(); $$(".chat").forEach(c => c.scrollTop = c.scrollHeight); $$("textarea[data-grow]").forEach(grow); save();
        }
        function ask(q) {
            if (!S.premium && S.used.n >= 5) {toast("You’ve used today’s 5 free questions. Upgrade for unlimited."); return }
            S.used.n++; S.chat.push({r: "me", t: q}); S.chat = S.chat.slice(-30); render();
            const hit = KB.find(([re]) => re.test(q.toLowerCase()));
            const ans = hit ? hit[1] : "Good question. Break it into parts, explain each in your own words, then test yourself with a flashcard. Tell me which part feels hardest and I’ll go deeper.";
            setTimeout(() => {S.chat.push({r: "bot", t: ans}); render()}, 500);
        }
        const move = (id, s) => {const t = S.tasks.find(x => x.id === id); if (!t || t.s === s) return; t.s = s; if (s === "done") t.p = 100; log(`Moved "${t.t}" to ${COLS.find(c => c[0] === s)[1]}`)};
        const sync = v => {U.q = v; const a = $("#q"), b = $("#dq"); if (a.value !== v) a.value = v; if (b.value !== v) b.value = v; filt()};
        $("#sico").innerHTML = ic("search");
        $("#mlogo").innerHTML = logo(32); setFavicon();
        document.addEventListener("input", e => {
            const el = e.target, f = el.dataset && el.dataset.fmt, p = U.pay;
            if (f && p) {
                const del = (e.inputType || "").startsWith("delete");
                if (f === "card") {
                    el.value = fmtCard(el.value); const d = el.value.replace(/\D/g, ""), b = d ? brandOf(d) : "";
                    const cv = $("#modal [name=cvc]"); if (cv) cv.maxLength = /^3[47]/.test(d) ? 4 : 3;
                    const a = $("#modal .cbd"); if (a) a.textContent = b; const c = $("#modal .cpb"); if (c) c.textContent = b;
                    const n = $("#modal .cpn"); if (n) n.textContent = el.value || "•••• •••• •••• ••••";
                } else if (f === "exp") {el.value = fmtExp(el.value, del); const x = $("#modal .cpe"); if (x) x.textContent = el.value || "MM / YY"}
                else if (f === "cvc") el.value = el.value.replace(/\D/g, "").slice(0, 4);
                el.classList.remove("bad");
            }
            if (p && el.name === "name") {const m = $("#modal .cpm"); if (m) m.textContent = el.value || "Your name"}
            if (el.dataset && el.dataset.grow) {grow(el); const c = el.parentElement.querySelector(".cnt"); if (c) c.textContent = el.value.length + "/" + el.maxLength}
        });
        $("#q").addEventListener("input", e => sync(e.target.value));
        $("#dq").addEventListener("input", e => sync(e.target.value));
        document.addEventListener("input", e => {if (e.target.dataset && e.target.dataset.rg) {const o = e.target.previousElementSibling; if (o) o.textContent = e.target.value + "%"} });
        document.addEventListener("keydown", e => {
            if (e.key === "Escape") {if (U.pay) {closePay(); render()} else if (U.modal) {U.modal = null; render()}}
            if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("mc")) {e.preventDefault(); e.target.click()}
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {e.preventDefault(); const d = $("#dq"); (d.offsetParent ? d : $("#q")).focus()}
            if (e.key === "Enter" && e.target.classList && e.target.classList.contains("kc")) {U.modal = {id: +e.target.dataset.id}; U.focus = true; render(); setTimeout(() => {const f = $("#modal [name=t], #modal [name=num]"); if (f) f.focus()}, 0)}
        });
        document.addEventListener("click", e => {
            if (e.target.classList.contains("ov")) {if (U.pay) closePay(); else U.modal = null; render(); return }
            const el = e.target.closest("[data-a]"); if (!el) return;
            if (U.pay && U.pay.step === "form") {const pf = $("#modal form.pf"); if (pf) U.pay.v = Object.fromEntries(new FormData(pf))}
            const a = el.dataset.a, i = el.dataset.i, n = S.cards.length;
            const task = () => S.tasks.find(x => x.id == i);
            const A = {
                tog() {const t = task(); if (t) {t.s = t.s === "done" ? "todo" : "done"; if (t.s === "done") t.p = 100; log(`${t.s === "done" ? "Completed" : "Reopened"} "${t.t}"`)} },
                del() {const t = task(); if (t) log(`Deleted "${t.t}"`); S.tasks = S.tasks.filter(x => x.id != i)},
                edit() {U.modal = {id: +i}; U.focus = true},
                new() {U.modal = {id: null, s: "todo"}; U.focus = true},
                addin() {U.modal = {id: null, s: el.dataset.k}; U.focus = true},
                mclose() {U.modal = null},
                mdel() {const t = S.tasks.find(x => x.id === U.modal.id); if (t) log(`Deleted "${t.t}"`); S.tasks = S.tasks.filter(x => x.id !== U.modal.id); U.modal = null; toast("Task deleted")},
                ck() {const t = task(); if (t && t.cl[+el.dataset.j]) t.cl[+el.dataset.j].d = !t.cl[+el.dataset.j].d},
                ccol() {U.cols[el.dataset.k] = !U.cols[el.dataset.k]},
                sortcol() {const k = el.dataset.k; const s = S.tasks.filter(t => t.s === k).sort((x, y) => x.d.localeCompare(y.d)); S.tasks = S.tasks.filter(t => t.s !== k).concat(s); toast("Sorted by due date")},
                clear() {const c = S.tasks.filter(t => t.s === "done").length; S.tasks = S.tasks.filter(t => t.s !== "done"); if (c) log(`Cleared ${c} completed tasks`); toast(c ? `Cleared ${c} completed` : "Nothing to clear")},
                filters() {U.filters = !U.filters},
                fclear() {S.f = {course: "", over: false, scope: S.f.scope}},
                nav() {S.view = el.dataset.v; S.seen[el.dataset.v] = true; U.filters = false; const v = $("#dview"); if (v) v.scrollTop = 0},
                collapse() {S.collapsed = !S.collapsed},
                theme() {S.theme = S.theme === "dark" ? "light" : "dark"},
                bell() {const w = S.tasks.filter(t => t.s !== "done" && daysTo(t.d) >= 0 && daysTo(t.d) <= 7).length; toast(`${overdue()} overdue, ${w} due this week`)},
                ndel() {S.notes = S.notes.filter(x => x.id != i); log("Deleted a note")},
                cdeli() {S.cards.splice(+i, 1); S.ci = Math.max(0, Math.min(S.ci, S.cards.length - 1)); S.flip = false},
                cdelc() {const c = S.courses[+i]; if (S.courses.length < 2) {toast("Keep at least one course"); return } if (S.tasks.some(t => t.c === c.n)) {toast("Move or delete this course’s tasks first"); return } S.courses.splice(+i, 1); log(`Removed course ${c.n}`)},
                mdelm() {S.members = S.members.filter(m => m.id != i); S.tasks.forEach(t => {t.w = (t.w || []).filter(x => x != i)})},
                clog() {S.log = []},
                export() {const b = new Blob([JSON.stringify({tasks: S.tasks, notes: S.notes, cards: S.cards, courses: S.courses, members: S.members}, null, 2)], {type: "application/json"}); const l = document.createElement("a"); l.href = URL.createObjectURL(b); l.download = "studymate-data.json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(l.href), 1000)},
                reset() {const th = S.theme; S = fresh(); S.theme = th; U.cols = {}; toast("Demo data restored")},
                chip() {ask(el.dataset.q)},
                flip() {S.flip = !S.flip},
                next() {S.ci = n ? (S.ci + 1) % n : 0; S.flip = false},
                prev() {S.ci = n ? (S.ci - 1 + n) % n : 0; S.flip = false},
                shuf() {S.cards.sort(() => Math.random() - .5); S.ci = 0; S.flip = false},
                cdel() {S.cards.splice(S.ci, 1); S.ci = Math.max(0, Math.min(S.ci, S.cards.length - 1)); S.flip = false},
                pick() {const q = S.quiz; if (q.pick === null) {q.pick = +i; if (+i === QZ[q.i][2]) q.score++} },
                qnext() {const q = S.quiz; if (q.i === QZ.length - 1) q.done = true; else {q.i++; q.pick = null} },
                qreset() {S.quiz = {i: 0, score: 0, done: false, pick: null}},
                upgrade() {
                    if (S.premium) {if (el.dataset.v) S.view = el.dataset.v; return}
                    if (S.sub) {S.premium = true; toast("Premium restored. Welcome back!"); if (el.dataset.v) S.view = el.dataset.v; return}
                    U.pay = {step: "form", plan: S.billing || "month", v: {}, err: {}, next: el.dataset.v || "plan", keep: false}; U.focus = true;
                },
                payclose() {closePay()},
                paybill() {U.pay.plan = el.dataset.v; S.billing = el.dataset.v; U.pay.keep = false},
                cancelsub() {S.premium = false; S.sub = null; log("Cancelled Premium"); toast("Subscription cancelled. You're on the Free plan")},
                smode() {S.sched.mode = el.dataset.v},
                mnav() {const [y, m] = S.sched.ym.split("-").map(Number); S.sched.ym = iso(new Date(y, m - 1 + +el.dataset.n, 1)).slice(0, 7)},
                mtoday() {S.sched.ym = today().slice(0, 7)},
                dayadd() {U.modal = {id: null, s: "todo", d: el.dataset.d}; U.focus = true},
                daymore() {U.dayopen = U.dayopen === el.dataset.d ? null : el.dataset.d},
                tstart() {const T = U.timer; T.run = true; T.end = Date.now() + T.left * 1000},
                tpause() {const T = U.timer; T.left = Math.max(0, Math.round((T.end - Date.now()) / 1000)); T.run = false},
                treset() {const T = U.timer; T.run = false; T.left = T.len[T.mode]},
                tmode() {const T = U.timer; T.mode = el.dataset.v; T.run = false; T.left = T.len[T.mode]},
                free() {if (S.premium) toast("Switched to the Free plan"); S.premium = false},
                bill() {S.billing = el.dataset.v}
            };
            if (A[a]) {A[a](); render(); if (U.focus) {U.focus = false; setTimeout(() => {const f = $("#modal [name=t], #modal [name=num]"); if (f) f.focus()}, 0)} }
        });
        document.addEventListener("change", e => {
            const el = e.target, c = el.dataset && el.dataset.ch; if (!c) return;
            const i = +el.dataset.i, v = el.type === "checkbox" ? el.checked : el.value; let r = true;
            const nt = () => S.notes.find(x => x.id === i), mb = () => S.members.find(x => x.id === i);
            if (c === "scope") S.f.scope = v;
            else if (c === "fcourse") S.f.course = v;
            else if (c === "fover") S.f.over = v;
            else if (c === "nt") {if (nt()) nt().t = v; r = false}
            else if (c === "nb") {if (nt()) nt().b = v; r = false}
            else if (c === "nk") {if (nt()) nt().k = v}
            else if (c === "cn") {const o = S.courses[i], nv = v.trim(); if (!nv || S.courses.some((x, j) => j !== i && x.n === nv)) {el.value = o.n; return } S.tasks.forEach(t => {if (t.c === o.n) t.c = nv}); if (S.f.course === o.n) S.f.course = nv; o.n = nv; r = false}
            else if (c === "ckk") {S.courses[i].k = v}
            else if (c === "mn") {if (mb() && v.trim()) mb().n = v.trim(); else el.value = mb().n}
            else if (c === "mk") {if (mb()) mb().k = v}
            else if (c === "pname") {if (v.trim()) S.profile.n = v.trim()}
            else if (c === "pemail") {if (v.trim()) S.profile.e = v.trim()}
            else if (c === "hrs") S.hrs = +v
            else if (c === "ftask") {S.focus.task = v; r = false}
            if (r) render(); else save();
        });
        document.addEventListener("dragstart", e => {const c = e.target.closest && e.target.closest(".kc"); if (c) {U.drag = +c.dataset.id; e.dataTransfer.setData("text/plain", c.dataset.id); e.dataTransfer.effectAllowed = "move"; c.classList.add("drag")} });
        document.addEventListener("dragover", e => {const col = e.target.closest && e.target.closest(".col"); if (col && U.drag !== null) {e.preventDefault(); $$(".col.over").forEach(x => {if (x !== col) x.classList.remove("over")}); col.classList.add("over")} });
        document.addEventListener("drop", e => {const col = e.target.closest && e.target.closest(".col"); if (col && U.drag !== null) {e.preventDefault(); move(U.drag, col.dataset.col); U.drag = null; $$(".col.over,.kc.drag").forEach(x => x.classList.remove("over", "drag")); render()} });
        document.addEventListener("dragend", () => {U.drag = null; $$(".col.over,.kc.drag").forEach(x => x.classList.remove("over", "drag"))});
        document.addEventListener("submit", e => {
            e.preventDefault(); const f = e.target, k = f.dataset.f, fd = new FormData(f), v = Object.fromEntries(fd);
            if (k === "pay") {
                const p = U.pay; if (!p || p.step !== "form") return;
                p.v = v; p.err = validatePay(v);
                if (Object.keys(p.err).length) {p.keep = false; render(); setTimeout(() => {const b = $("#modal .bad"); if (b) b.focus()}, 0); return }
                p.step = "processing"; p.keep = false; render();
                setTimeout(() => {
                    if (!U.pay) return;
                    const d = v.num.replace(/\D/g, "");
                    S.sub = {plan: p.plan, last4: d.slice(-4), brand: brandOf(d), amount: p.plan === "year" ? 120 : 15, since: Date.now(), rcpt: "SM-" + Math.random().toString(36).slice(2, 8).toUpperCase()};
                    S.premium = true; S.billing = p.plan; log(`Upgraded to Premium (${p.plan === "year" ? "yearly" : "monthly"})`);
                    p.step = "done"; p.keep = false; render();
                }, 1900);
                return;
            }
            if (k === "task") {S.tasks.push({id: uid(), t: v.t.trim(), c: v.c, ty: "Task", d: v.d, s: "todo", p: 0, tags: [], w: [], n: "", cl: []}); log(`Added "${v.t.trim()}"`); f.reset()}
            if (k === "mtask") {
                const old = U.modal.id ? S.tasks.find(x => x.id === U.modal.id) : null;
                const cl = v.cl.split("\n").map(x => x.trim()).filter(Boolean).map(x => ({t: x, d: !!(old && old.cl.find(y => y.t === x && y.d))}));
                const o = {t: v.t.trim(), c: v.c, ty: v.ty, s: v.s, d: v.d, p: v.s === "done" ? 100 : +v.p, tags: v.tags.split(",").map(x => x.trim().replace(/^#/, "")).filter(Boolean), n: v.n.trim(), w: fd.getAll("w").map(Number), cl};
                if (old) {Object.assign(old, o); log(`Updated "${o.t}"`)} else {S.tasks.push(Object.assign({id: uid()}, o)); log(`Added "${o.t}"`)}
                U.modal = null; toast(old ? "Task updated" : "Task added");
            }
            if (k === "card") {if (!S.premium && S.cards.length >= 10) {toast("Free plan is limited to 10 flashcards. Upgrade for unlimited."); return } S.cards.push({q: v.q.trim(), a: v.a.trim()}); S.ci = S.cards.length - 1; S.flip = false; f.reset()}
            if (k === "ask") {f.reset(); ask(v.q.trim()); return }
            if (k === "note") {S.notes.unshift({id: uid(), t: v.t.trim(), b: (v.b || "").trim(), k: v.k}); log(`Added note "${v.t.trim()}"`); f.reset()}
            if (k === "course") {const n = v.n.trim(); if (S.courses.some(c => c.n === n)) {toast("That course already exists"); return } S.courses.push({n, k: v.k}); log(`Added course ${n}`); f.reset()}
            if (k === "member") {S.members.push({id: uid(), n: v.n.trim(), k: v.k}); log(`Added ${v.n.trim()} to the team`); f.reset()}
            if (k === "contact") {log(`Sent support message: ${v.s.trim()}`); toast("Message sent. This is a demo"); f.reset()}
            render();
        });
        render();
    </script>
